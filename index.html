<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jansahayak Chatbot Assistant</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --user-msg: #2563eb;
      --bot-msg: #334155;
      --text-color: #f8fafc;
      --muted-text: #94a3b8;
      --border-color: #334155;
      --accent: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background-color: var(--chat-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.45);
    }

    .chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
    }

    .chat-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent);
      border-radius: 50%;
    }

    .quick-prompts {
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.35);
    }

    .chip {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chip:hover {
      background: #334155;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-line;
      word-wrap: break-word;
    }

    .message.bot {
      background-color: var(--bot-msg);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background-color: var(--user-msg);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.6);
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--user-msg);
    }

    button.send-btn {
      background-color: var(--user-msg);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    button.send-btn:hover {
      opacity: 0.92;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1><span class="status-dot"></span> Jansahayak Chatbot</h1>
      <span style="font-size: 0.8rem; color: var(--muted-text);">Guided Assistant</span>
    </div>

    <div class="quick-prompts">
      <button class="chip" type="button" onclick="sendQuickPrompt('Start form')">Start Form</button>
      <button class="chip" type="button" onclick="sendQuickPrompt('What is this portal for?')">About Portal</button>
      <button class="chip" type="button" onclick="sendQuickPrompt('Help')">Help</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">Namaste! Welcome to the Jansahayak Chatbot.
I can help you fill out your details step-by-step or answer questions. Type "Start form" or click a quick button above to begin.</div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Type your message or answer here..." autocomplete="off" required />
      <button class="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const chatMessages = document.getElementById("chatMessages");

    let step = 0;
    const formData = {
      fullName: "",
      location: "",
      purpose: ""
    };

    function appendMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.textContent = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getBotReply(rawInput) {
      const input = rawInput.trim();
      const lower = input.toLowerCase();

      if (step === 1) {
        formData.fullName = input;
        step = 2;
        return `Thanks, ${formData.fullName}. Which city, district, or state are you submitting this from?`;
      }

      if (step === 2) {
        formData.location = input;
        step = 3;
        return `Got it (${formData.location}). What service, information, or support do you need today?`;
      }

      if (step === 3) {
        formData.purpose = input;
        step = 0;
        return `Here is a summary of what you entered:\n• Name: ${formData.fullName}\n• Location: ${formData.location}\n• Request: ${formData.purpose}\n\nType "Start form" anytime if you want to submit another response.`;
      }

      if (lower.includes("start") || lower.includes("form")) {
        step = 1;
        return "Let's start your submission. First, what is your full name?";
      }

      if (lower.includes("portal") || lower.includes("jansankhya") || lower.includes("jansahayak")) {
        return "This chatbot guides users step-by-step through sharing basic details and finding assistance. Type \"Start form\" to walk through the questions one by one.";
      }

      if (lower.includes("help")) {
        return "You can:\n1. Type \"Start form\" to enter your Name, Location, and Request step-by-step.\n2. Ask \"What is this portal for?\" for an overview.\n3. Edit getBotReply() in index.html to add custom questions or fields.";
      }

      return `You said: "${input}". Type "Start form" to begin the guided questions, or type "Help" to see what I can do.`;
    }

    function handleUserMessage(message) {
      appendMessage(message, "user");
      setTimeout(() => {
        const reply = getBotReply(message);
        appendMessage(reply, "bot");
      }, 350);
    }

    function sendQuickPrompt(text) {
      handleUserMessage(text);
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;
      userInput.value = "";
      handleUserMessage(message);
    });
  </script>

</body>
</html>
