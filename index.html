<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant Chatbot</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --user-msg: #3b82f6;
      --bot-msg: #334155;
      --text-color: #f8fafc;
      --muted-text: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background-color: var(--chat-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
    }

    .chat-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message.bot {
      background-color: var(--bot-msg);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background-color: var(--user-msg);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.5);
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--user-msg);
    }

    button {
      background-color: var(--user-msg);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1><span class="status-dot"></span> AI Assistant</h1>
      <span style="font-size: 0.8rem; color: var(--muted-text);">Online</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        Hello! How can I help you today? Ask me anything!
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const chatMessages = document.getElementById("chatMessages");

    function appendMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.textContent = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Customize your chatbot's responses here
    function getBotReply(input) {
      const text = input.toLowerCase();
      if (text.includes("hello") || text.includes("hi")) {
        return "Hi there! What would you like to know?";
      }
      if (text.includes("help")) {
        return "I can answer questions about this website, guide you through features, or chat with you!";
      }
      return "You asked: \"" + input + "\". You can customize my responses inside the getBotReply() function in index.html!";
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      userInput.value = "";

      setTimeout(() => {
        const reply = getBotReply(message);
        appendMessage(reply, "bot");
      }, 500);
    });
  </script>

</body>
</html>
